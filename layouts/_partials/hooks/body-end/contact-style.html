<style>
  #contact .contact-card{
    max-width:76rem;margin:0 auto;display:grid;grid-template-columns:1.5fr 1fr;gap:3rem;

  }

  .dark #contact .contact-card{
    background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08);box-shadow:none;
  }
  #contact .contact-connect h3{font-size:1.5rem;font-weight:700;margin:0 0 .6rem;color:inherit;}
  #contact .contact-connect p{margin:0 0 1.4rem;color:#6b7280;line-height:1.6;}
  .dark #contact .contact-connect p{color:#9ca3af;}

  #contact .contact-lbl{font-weight:500;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:#9ca3af;margin-bottom:.1rem;}
