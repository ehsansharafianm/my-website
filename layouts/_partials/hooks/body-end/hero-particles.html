<script>
document.addEventListener('DOMContentLoaded', function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (window.innerWidth < 768) return; // skip phones: battery and speed

  var sec = document.getElementById('section-resume-biography-3');
  if (!sec) return;

  var canvas = document.createElement('canvas');
  canvas.setAttribute('aria-hidden', 'true');
  canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;';
  sec.appendChild(canvas);

  var ctx = canvas.getContext('2d');
  var N = 42, LINK = 130;
  var dots = [], W = 0, H = 0, running = false;

  function isDark() {
    var de = document.documentElement;
    return de.classList.contains('dark') || de.dataset.theme === 'dark';
  }
  function colors() {
    return isDark()
      ? { dot: 'rgba(147,197,253,0.55)', line: 'rgba(147,197,253,' }
      : { dot: 'rgba(37,99,235,0.40)', line: 'rgba(37,99,235,' };
  }
  function resize() {
    W = canvas.width = sec.clientWidth;
    H = canvas.height = sec.clientHeight;
  }
  function init() {
    dots = [];
    for (var i = 0; i < N; i++) {
      dots.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35,
        r: 1.2 + Math.random() * 1.6
      });
    }
  }
  function step() {
    if (!running) return;
    ctx.clearRect(0, 0, W, H);
    var c = colors();
    for (var i = 0; i < N; i++) {
      var d = dots[i];
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0 || d.x > W) d.vx *= -1;
      if (d.y < 0 || d.y > H) d.vy *= -1;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.283);
      ctx.fillStyle = c.dot; ctx.fill();
      for (var j = i + 1; j < N; j++) {
        var e = dots[j];
        var dx = d.x - e.x, dy = d.y - e.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < LINK) {
          ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(e.x, e.y);
          ctx.strokeStyle = c.line + (0.18 * (1 - dist / LINK)).toFixed(3) + ')';
          ctx.lineWidth = 1; ctx.stroke();
        }
      }
    }
    requestAnimationFrame(step);
  }

  // Animate only while the hero is on screen
  var vis = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      var was = running;
      running = e.isIntersecting;
      if (running && !was) requestAnimationFrame(step);
    });
  });
  vis.observe(sec);

  resize(); init();
  window.addEventListener('resize', function () { resize(); init(); });
});
</script>
