<script>
document.addEventListener('DOMContentLoaded', function () {
  // The homepage bio card already lists education, so hide the duplicate
  // Education timeline inside the homepage #experience block only.
  var sec = document.getElementById('experience');
  if (!sec) return;
  sec.querySelectorAll('h2').forEach(function (h2) {
    if (h2.textContent.trim() === 'Education') {
      var wrap = h2.parentElement;
      if (wrap) wrap.style.display = 'none';
    }
  });
});
</script>
