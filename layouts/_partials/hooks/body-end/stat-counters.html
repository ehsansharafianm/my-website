<style>
  .hb-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:2rem 4.5rem;text-align:center}
  .hb-stat{display:flex;flex-direction:column;min-width:9rem}
  .hb-stat-num{font-size:2.6rem;font-weight:800;line-height:1.1;color:var(--color-primary-600,#2563eb)}
  .dark .hb-stat-num,[data-theme="dark"] .hb-stat-num{color:var(--color-primary-300,#93c5fd)}
  .hb-stat-label{margin-top:.3rem;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:#6b7280}
  .dark .hb-stat-label,[data-theme="dark"] .hb-stat-label{color:#9ca3af}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var nums = document.querySelectorAll('.hb-stat-num[data-count]');
  if (!nums.length) return;

  function finish(el) {
    el.textContent = el.dataset.count + (el.dataset.suffix || '');
  }
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) {
    nums.forEach(finish);
    return;
  }
  function animate(el) {
    var target = parseInt(el.dataset.count, 10) || 0;
    var suffix = el.dataset.suffix || '';
    var t0 = null, DUR = 1300;
    function frame(t) {
      if (!t0) t0 = t;
      var p = Math.min((t - t0) / DUR, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * eased) + suffix;
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { animate(e.target); io.unobserve(e.target); }
    });
  }, { threshold: 0.6 });
  nums.forEach(function (el) { io.observe(el); });
});
</script>
