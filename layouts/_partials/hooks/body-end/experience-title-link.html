<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('h3.text-xl.font-bold').forEach(function (title) {
    if (title.dataset.linked) return;
    // The card that holds this role title
    var card = title.closest('.rounded-xl');
    if (!card) return;
    // The action button link at the bottom of the same card
    var btn = card.querySelector('.border-t a[href]');
    if (!btn) return;
    var href = btn.getAttribute('href');
    if (!href) return;
    // Wrap the title text in a link to the same URL
    var a = document.createElement('a');
    a.href = href;
    a.className = 'hover:underline';
    while (title.firstChild) { a.appendChild(title.firstChild); }
    title.appendChild(a);
    title.dataset.linked = '1';
  });
});
</script>
